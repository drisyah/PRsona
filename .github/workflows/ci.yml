name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs Electron and prebuilt better-sqlite3 binaries; no signing,
      # no packaging — tests are fully offline and need no API keys.
      - run: npm ci

      - run: npm test
